<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <title>Gold</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main>
    <!-- TODAY -->
    <section id="view-today" class="view">
      <div class="hero">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 140 140" aria-hidden="true">
            <defs>
              <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFD97A" />
                <stop offset="100%" stop-color="#A87B1F" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="70" cy="70" r="60" />
            <circle class="ring-mark" cx="70" cy="70" r="60" id="ring-mark" />
            <circle class="ring-fill" cx="70" cy="70" r="60" id="ring-fill" />
          </svg>
          <div class="ring-center">
            <div class="ring-points" id="ring-points">0</div>
            <div class="ring-of" id="ring-of">of 0</div>
          </div>
        </div>
        <div class="hero-side">
          <div class="hero-date" id="hero-date"></div>
          <button class="stat streak" id="streak-stat" type="button">
            <span class="stat-icon">🔥</span>
            <span class="stat-num" id="streak-num">0</span>
            <span class="stat-label">day streak</span>
          </button>
          <button class="stat tickets" id="tickets-stat" type="button">
            <span class="stat-icon">🎟️</span>
            <span class="stat-num" id="tickets-num">0</span>
            <span class="stat-label">spins ready</span>
          </button>
        </div>
      </div>

      <div id="habit-list"></div>
      <p class="hint" id="today-hint"></p>
    </section>

    <!-- WHEEL -->
    <section id="view-wheel" class="view" hidden>
      <h2 class="view-title">The Wheel</h2>
      <div class="ticket-strip" id="ticket-strip"></div>
      <div class="wheel-stage">
        <div class="wheel-glow" aria-hidden="true"></div>
        <div id="wheel-host"></div>
      </div>
      <button class="btn spin-btn" id="spin-btn" type="button">Spin</button>
      <p class="hint center" id="wheel-hint"></p>
      <div class="odds" id="odds-list"></div>
    </section>

    <!-- VAULT -->
    <section id="view-vault" class="view" hidden>
      <h2 class="view-title">The Vault</h2>
      <div id="vault-open"></div>
      <h3 class="sub" id="vault-past-head" hidden>Already used</h3>
      <div id="vault-past"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" hidden>
      <h2 class="view-title">Settings</h2>

      <div class="card">
        <h3>Habits</h3>
        <div id="habits-editor"></div>
        <button class="btn small" id="add-habit-btn" type="button">+ Add habit</button>
      </div>

      <div class="card">
        <h3>The deal</h3>
        <label class="field">
          <span>Points needed for a spin</span>
          <input type="number" id="set-target" min="1" step="1" inputmode="numeric" />
        </label>
        <p class="hint" id="target-hint"></p>
        <label class="field">
          <span>Bonus spin every N days in a row</span>
          <input type="number" id="set-streak" min="2" step="1" inputmode="numeric" />
        </label>
        <button class="btn small primary" id="save-deal-btn" type="button">Save</button>
        <span class="saved" id="deal-saved" hidden>Saved ✓</span>
      </div>

      <div class="card">
        <h3>Prizes</h3>
        <div id="prizes-editor"></div>
        <button class="btn small" id="add-prize-btn" type="button">+ Add prize</button>
      </div>

      <div class="card">
        <h3>Backup</h3>
        <p class="hint" id="backup-hint"></p>
        <div class="btn-row">
          <button class="btn small" id="backup-btn" type="button">Export</button>
          <button class="btn small" id="restore-btn" type="button">Restore</button>
        </div>
        <input type="file" id="restore-file" accept="application/json" hidden />
      </div>
    </section>
  </main>

  <nav id="tabs">
    <button data-view="today" class="tab active" type="button"><span>◎</span>Today</button>
    <button data-view="wheel" class="tab" type="button"><span>✦</span>Wheel</button>
    <button data-view="vault" class="tab" type="button"><span>◈</span>Vault</button>
    <button data-view="settings" class="tab" type="button"><span>⚙</span>Settings</button>
  </nav>

  <!-- ticket earned -->
  <div class="overlay" id="ticket-overlay" hidden>
    <div class="ticket-scene">
      <div class="ticket" id="ticket-card">
        <div class="ticket-stub">🎟️</div>
        <div class="ticket-body">
          <div class="ticket-kicker" id="ticket-kicker">SPIN EARNED</div>
          <div class="ticket-title" id="ticket-title">One spin of the wheel</div>
          <div class="ticket-sub" id="ticket-sub"></div>
        </div>
        <div class="shimmer" aria-hidden="true"></div>
      </div>
      <div class="btn-row center">
        <button class="btn primary" id="ticket-spin" type="button">Spin now</button>
        <button class="btn" id="ticket-later" type="button">Later</button>
      </div>
    </div>
  </div>

  <!-- prize won -->
  <div class="overlay" id="win-overlay" hidden>
    <div class="win-scene">
      <div class="win-kicker">YOU WON</div>
      <div class="win-card" id="win-card">
        <div class="win-emoji" id="win-emoji"></div>
        <div class="win-name" id="win-name"></div>
      </div>
      <button class="btn primary" id="win-ok" type="button">Add to vault</button>
    </div>
  </div>

  <div class="modal" id="editor-modal" hidden>
    <div class="sheet">
      <h3 id="editor-title"></h3>
      <div id="editor-fields"></div>
      <div class="btn-row">
        <button class="btn primary" id="editor-save" type="button">Save</button>
        <button class="btn" id="editor-cancel" type="button">Cancel</button>
        <button class="btn danger" id="editor-delete" type="button" hidden>Delete</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="logic.js"></script>
  <script src="db.js"></script>
  <script src="wheel.js"></script>
  <script src="app.js"></script>
</body>
</html>
